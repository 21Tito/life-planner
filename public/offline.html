<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline · Life Planner</title>
  <style>
    :root { --brand: #003C71; --text: #111827; --muted: #6B7280; --bg: #ffffff; --card: #F9FAFB; --border: #E5E7EB; }
    @media (prefers-color-scheme: dark) {
      :root { --brand: #7fb3e6; --text: #F3F4F6; --muted: #9CA3AF; --bg: #111214; --card: #1b1d21; --border: #2a2d33; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 22rem; text-align: center; }
    .icon { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: var(--card); border: 1px solid var(--border); color: var(--brand); }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: var(--muted); font-size: 0.95rem; }
    .links { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    a, button {
      font: inherit; font-size: 0.9rem; font-weight: 600; text-decoration: none; cursor: pointer;
      padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text);
    }
    a.primary { background: var(--brand); border-color: var(--brand); color: var(--bg); }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.43"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>This page hasn't been saved on this device yet. Pages you've opened before still work, and your shopping list syncs when you're back online.</p>
    <div class="links">
      <a class="primary" href="/shopping">Shopping list</a>
      <a href="/dashboard">Home</a>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </main>
</body>
</html>
